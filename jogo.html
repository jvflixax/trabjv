<title>Fronteira Estelar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: uma coluna estilo celular — setor e portais no topo, arena no meio, painel da nave embaixo */
:root {
  --bg: #050b0f; --panel: #0b1820; --line: #1d4a55; --fg: #d6eef0; --dim: #7fa3aa;
  --accent: #3fd6d0; --gold: #f2b544; --hp: #4fd17a; --shield: #4aa3ff; --danger: #ff4d5e;
  --display: "Chakra Petch", "Segoe UI", sans-serif; --body: "Rajdhani", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 600 16px/1.3 var(--body); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
main { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 1.5rem var(--display); text-align: center; margin: 0; text-wrap: balance; }
.sub { text-align: center; color: var(--dim); margin-top: -8px; }
.nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; }
.portal { width: 96px; aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer; color: var(--accent);
  font: 700 1.4rem var(--display); background: radial-gradient(circle, var(--bg) 52%, transparent 54%),
  repeating-conic-gradient(var(--line) 0 6deg, var(--dim) 6deg 9deg); box-shadow: 0 0 18px #3fd6d033; }
.portal:disabled { opacity: .25; cursor: not-allowed; }
.portal:not(:disabled):hover { box-shadow: 0 0 28px #3fd6d088; }
.ship { width: 64px; height: 64px; display: grid; place-items: center; font-size: .8rem; color: var(--dim); text-align: center; }
.arena { min-height: 190px; border: 1px solid var(--line); background: #0b182099; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.enemy-name { font: 700 1.15rem var(--display); }
.boss { color: var(--danger); }
.bar { height: 10px; background: #00000080; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; transition: width .25s; }
.log { margin: 0; padding: 0; list-style: none; color: var(--dim); font-size: .95rem; }
.log li:first-child { color: var(--fg); }
.actions { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--panel);
  border-block: 1px solid var(--line); padding: 10px 12px; }
button { font: inherit; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 12px; border-radius: 4px; cursor: pointer; }
.go { background: linear-gradient(#3bbf5c, #1f8a3d); border-color: #6fe08e; font: 700 1.2rem var(--display); padding: 10px; }
.go:disabled { filter: grayscale(1); opacity: .6; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
label { display: flex; gap: 6px; align-items: center; cursor: pointer; line-height: 1.1; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.stats { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.stats h2 { font: 700 1.05rem var(--display); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-variant-numeric: tabular-nums; }
.grid dt { color: var(--dim); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.grid dd { margin: 0 0 4px; }
.shop { display: flex; flex-direction: column; gap: 8px; }
.shop .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.gold { color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <h1 id="mapName"></h1>
  <div class="sub" id="mapEnemies"></div>
  <div class="nav">
    <button class="portal" id="prev" aria-label="Setor anterior"></button>
    <div class="ship">▲<br>Estação</div>
    <button class="portal" id="next" aria-label="Próximo setor"></button>
  </div>

  <section class="arena" aria-live="polite">
    <div id="foe"></div>
    <ul class="log" id="log"></ul>
  </section>

  <div class="actions">
    <button class="btn" id="menuBtn" aria-expanded="false">Hangar</button>
    <button class="btn go" id="search">Buscar inimigo</button>
    <label><input type="checkbox" id="auto"> Auto-batalha</label>
  </div>

  <section class="stats shop" id="shop" hidden></section>

  <section class="stats">
    <h2 id="pilot"></h2>
    <dl class="grid" id="grid"></dl>
  </section>
</main>

<script>
const SECTORS = [
  { id: '1-1', name: 'Vega',   foe: 'Zarnid' },
  { id: '1-2', name: 'Altair', foe: 'Kryll' },
  { id: '1-3', name: 'Rigel',  foe: 'Voruk' },
  { id: '1-4', name: 'Deneb',  foe: 'Skarn' },
  { id: '1-5', name: 'Sirius', foe: 'Nyxar' },
];
const UPGRADES = { dmg: 'Canhões (+15% dano)', hp: 'Casco (+20% vida)', shield: 'Escudo (+20%)' };
const fmt = n => Math.floor(n).toLocaleString('pt-BR');
const cost = lvl => Math.floor(100 * 1.6 ** lvl);
const xpNeed = lvl => Math.floor(100 * 1.5 ** (lvl - 1));
// escudo absorve primeiro, o resto vai para a vida
function applyDamage(shield, hp, dmg) { const s = Math.min(shield, dmg); return [shield - s, Math.max(0, hp - (dmg - s))]; }
console.assert(applyDamage(50, 100, 80).join() === '0,70' && applyDamage(100, 100, 30).join() === '70,100' && cost(0) === 100, 'auto-teste falhou');

const fresh = () => ({ map: 0, unlocked: 0, hp: 1000, shield: 500, credits: 0, xp: 0, level: 1, kills: 0, up: { dmg: 0, hp: 0, shield: 0 }, auto: false });
let S = fresh(), foe = null, timer = null, log = [];

const maxHp = () => 1000 * 1.2 ** S.up.hp * (1 + (S.level - 1) * .05);
const maxShield = () => 500 * 1.2 ** S.up.shield * (1 + (S.level - 1) * .05);
const dmg = () => 60 * 1.15 ** S.up.dmg * (1 + (S.level - 1) * .05);

function load() { try { const d = JSON.parse(localStorage.getItem('fronteira') || 'null'); if (d) S = { ...fresh(), ...d }; } catch {} }
function save() { try { localStorage.setItem('fronteira', JSON.stringify(S)); } catch {} }
function say(t) { log.unshift(t); log = log.slice(0, 4); }

function spawn() {
  const sec = SECTORS[S.map], k = 1.9 ** S.map, boss = Math.random() < .1;
  const m = boss ? 5 : 1;
  foe = { name: (boss ? 'Chefe-' : '') + sec.foe, boss, maxHp: 400 * k * m, hp: 400 * k * m, dmg: 22 * k * (boss ? 2 : 1),
          reward: 30 * k * (boss ? 6 : 1), xp: 20 * k * (boss ? 6 : 1) };
  say(`${foe.name} encontrado em ${sec.name}!`);
  timer = setInterval(tick, 600);
  render();
}

function tick() {
  foe.hp -= dmg() * (0.85 + Math.random() * .3);
  if (foe.hp <= 0) return win();
  [S.shield, S.hp] = applyDamage(S.shield, S.hp, foe.dmg * (0.85 + Math.random() * .3));
  if (S.hp <= 0) return lose();
  render();
}

function win() {
  clearInterval(timer); timer = null;
  S.credits += foe.reward; S.xp += foe.xp; S.kills++;
  say(`${foe.name} destruído: +${fmt(foe.reward)} créditos, +${fmt(foe.xp)} XP`);
  if (foe.boss && S.unlocked === S.map && S.map < SECTORS.length - 1) { S.unlocked++; say(`Portal para ${SECTORS[S.map + 1].id} liberado!`); }
  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; say(`Subiu para o nível ${S.level}!`); }
  foe = null; save(); render();
}

function lose() {
  clearInterval(timer); timer = null;
  const lost = S.credits * .1; S.credits -= lost;
  say(`Nave destruída! Perdeu ${fmt(lost)} créditos. Reparo de emergência aplicado.`);
  S.hp = maxHp() * .3; S.shield = 0; foe = null; S.auto = false; save(); render();
}

// fora de combate: escudo recarrega rápido, casco devagar; auto-batalha busca o próximo
setInterval(() => {
  if (foe) return;
  S.shield = Math.min(maxShield(), S.shield + maxShield() * .05);
  S.hp = Math.min(maxHp(), S.hp + maxHp() * .01);
  if (S.auto && S.hp > maxHp() * .4) spawn(); else render();
}, 1000);

function go(dir) { if (foe) return; S.map += dir; say(`Saltou para ${SECTORS[S.map].id} ${SECTORS[S.map].name}`); save(); render(); }
function buy(key) { const c = cost(S.up[key]); if (S.credits < c) return; S.credits -= c; S.up[key]++; save(); render(); }
function repair() { const c = Math.ceil((maxHp() - S.hp) * .5); if (S.credits < c || c <= 0) return; S.credits -= c; S.hp = maxHp(); save(); render(); }

const $ = id => document.getElementById(id);
const bar = (v, max, color) => `<div class="bar"><i style="width:${Math.max(0, v / max * 100)}%;background:${color}"></i></div>`;

function render() {
  const sec = SECTORS[S.map];
  $('mapName').textContent = `Setor: [ ${sec.id} ] ${sec.name}`;
  $('mapEnemies').textContent = `[ ${sec.foe} ] [ Chefe-${sec.foe} ]`;
  $('prev').textContent = S.map > 0 ? SECTORS[S.map - 1].id : '—';
  $('next').textContent = S.map < SECTORS.length - 1 ? SECTORS[S.map + 1].id : '—';
  $('prev').disabled = !!foe || S.map === 0;
  $('next').disabled = !!foe || S.map >= S.unlocked;
  $('next').title = S.map >= S.unlocked && S.map < SECTORS.length - 1 ? `Derrote o Chefe-${sec.foe} para liberar` : '';
  $('search').disabled = !!foe;
  $('search').textContent = foe ? 'Em combate…' : 'Buscar inimigo';
  $('auto').checked = S.auto;
  $('foe').innerHTML = foe
    ? `<div class="enemy-name ${foe.boss ? 'boss' : ''}">${foe.name}</div>${bar(foe.hp, foe.maxHp, 'var(--danger)')}<small>${fmt(Math.max(0, foe.hp))} / ${fmt(foe.maxHp)}</small>`
    : `<div class="enemy-name" style="color:var(--dim)">Nenhum inimigo por perto</div><small>Chefes aparecem em 10% das buscas e liberam o próximo setor.</small>`;
  $('log').innerHTML = log.map(t => `<li>${t}</li>`).join('');
  $('pilot').textContent = `Piloto · Nave: Falcão Nv. ${S.level}`;
  $('grid').innerHTML = `
    <div><dt>Vida</dt><dd>${fmt(S.hp)} / ${fmt(maxHp())}</dd>${bar(S.hp, maxHp(), 'var(--hp)')}</div>
    <div><dt>Escudo</dt><dd>${fmt(S.shield)} / ${fmt(maxShield())}</dd>${bar(S.shield, maxShield(), 'var(--shield)')}</div>
    <div><dt>Dano</dt><dd>${fmt(dmg())}</dd></div>
    <div><dt>Créditos</dt><dd class="gold">${fmt(S.credits)}</dd></div>
    <div><dt>Nível</dt><dd>${S.level}</dd></div>
    <div><dt>XP</dt><dd>${fmt(S.xp)} / ${fmt(xpNeed(S.level))}</dd></div>
    <div><dt>Abates</dt><dd>${fmt(S.kills)}</dd></div>
    <div><dt>Setores</dt><dd>${S.unlocked + 1} / ${SECTORS.length}</dd></div>`;
  if (!$('shop').hidden) {
    const rc = Math.ceil((maxHp() - S.hp) * .5);
    $('shop').innerHTML = `<h2>Hangar</h2>` + Object.entries(UPGRADES).map(([k, label]) =>
      `<div class="row"><span>${label} · Nv. ${S.up[k]}</span><button class="btn" data-buy="${k}" ${S.credits < cost(S.up[k]) ? 'disabled' : ''}>${fmt(cost(S.up[k]))} cr</button></div>`).join('')
      + `<div class="row"><span>Reparar casco</span><button class="btn" data-repair ${rc <= 0 || S.credits < rc ? 'disabled' : ''}>${fmt(Math.max(0, rc))} cr</button></div>`
      + `<div class="row"><span style="color:var(--dim)">Recomeçar do zero</span><button class="btn" data-reset>Zerar jogo</button></div>`;
  }
}

$('search').onclick = () => !foe && spawn();
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('auto').onchange = e => { S.auto = e.target.checked; save(); };
$('menuBtn').onclick = () => { const s = $('shop'); s.hidden = !s.hidden; $('menuBtn').setAttribute('aria-expanded', !s.hidden); render(); };
let resetArmed = false;
$('shop').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.buy) buy(b.dataset.buy);
  else if ('repair' in b.dataset) repair();
  else if ('reset' in b.dataset) {
    if (!resetArmed) { resetArmed = true; b.textContent = 'Toque de novo p/ confirmar'; return; }
    clearInterval(timer); timer = null; foe = null; S = fresh(); log = []; resetArmed = false; save(); render();
  }
};

// fundo: estrelas e meteoros
const cv = $('sky'), cx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let stars = [], meteors = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; stars = Array.from({ length: 140 }, () => [Math.random() * cv.width, Math.random() * cv.height, Math.random() * 1.4]); }
function frame() {
  cx.fillStyle = '#050b0f'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.fillStyle = '#9fd'; stars.forEach(([x, y, r]) => { cx.globalAlpha = .3 + r / 2; cx.fillRect(x, y, r, r); });
  cx.globalAlpha = 1;
  if (!still && Math.random() < .04) meteors.push({ x: Math.random() * cv.width * 1.2, y: -20, life: 1 });
  meteors = meteors.filter(m => (m.x -= 4, m.y += 9, m.life -= .012) > 0);
  meteors.forEach(m => { const g = cx.createLinearGradient(m.x, m.y, m.x + 28, m.y - 63);
    g.addColorStop(0, `rgba(63,214,208,${m.life})`); g.addColorStop(1, 'rgba(63,214,208,0)');
    cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(m.x, m.y); cx.lineTo(m.x + 28, m.y - 63); cx.stroke(); });
  if (!still) requestAnimationFrame(frame);
}
addEventListener('resize', () => { size(); if (still) frame(); });
size(); frame();

load();
if (!S.kills) say('Bem-vindo, piloto. Toque em "Buscar inimigo" para começar.');
render();
</script>
